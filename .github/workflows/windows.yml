name: Windows

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native MSVC
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Test workspace
        run: cargo test --locked --workspace --all-features

      - name: Build release binary
        run: cargo build --locked --release --workspace --all-features

      - name: Smoke test release binary
        run: |
          .\target\release\meridian.exe --version
          .\target\release\meridian.exe status

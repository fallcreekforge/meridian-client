name: Migrations

on:
  pull_request:

permissions:
  contents: read

jobs:
  migrations:
    name: Migration policy and replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository and base history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Check migration policy and replay
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        shell: nix develop .#migrations -c nu {0}
        run: just db-migrations-check $env.BASE_REVISION
